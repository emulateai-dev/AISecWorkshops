services:
  gauntlet:
    build: .
    container_name: gauntlet
    env_file: .env
    environment:
      # Reach the host's Ollama (local models for L1-L4) from inside the container.
      # Requires Ollama to listen on 0.0.0.0 (set OLLAMA_HOST=0.0.0.0 on the host).
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GAUNTLET_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data                                  # sessions/findings persist
      - ${SECRETS_DIR:-/home/dtx/.secrets}:/secrets:ro     # read keys the lab's way
    restart: unless-stopped

  # Optional local models. Enable with:  docker compose --profile local up -d
  ollama:
    image: ollama/ollama
    container_name: gauntlet-ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama: {}
