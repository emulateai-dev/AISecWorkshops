<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gauntlet</title>
<style>
  :root{ --navy:#070a2d; --panel:#0e1246; --panel2:#141a5c; --cyan:#00e5cf; --ink:#e7eaff; --mut:#8e96d6; --win:#36e07a; --warn:#ffcf5c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;background:var(--navy);color:var(--ink)}
  header{padding:14px 20px;border-bottom:1px solid #1c237a;display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header .tag{color:var(--cyan);font-weight:700}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 53px)}
  aside{border-right:1px solid #1c237a;overflow-y:auto;padding:14px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:4px 0 10px}
  .ch{background:var(--panel);border:1px solid #232b86;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .ch:hover{border-color:var(--cyan)}
  .ch .t{font-weight:600;font-size:14px}
  .ch .m{color:var(--mut);font-size:12px;margin-top:3px}
  .ch.dis{opacity:.5;cursor:not-allowed}
  main{display:flex;flex-direction:column;min-width:0}
  .bar{padding:10px 16px;border-bottom:1px solid #1c237a;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bar select,.bar input,.bar button{background:var(--panel2);color:var(--ink);border:1px solid #2a3290;border-radius:8px;padding:7px 10px;font-size:13px}
  .bar button{cursor:pointer;background:var(--cyan);color:#021018;border:none;font-weight:700}
  .bar button.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan)}
  .brief{padding:10px 16px;color:var(--mut);font-size:13px;border-bottom:1px solid #1c237a}
  .brief b{color:var(--ink)}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.4;font-size:14px}
  .me{align-self:flex-end;background:#1b227a}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid #232b86}
  .sys{align-self:center;color:var(--warn);font-size:12px}
  .think{color:var(--mut);font-style:italic;border-left:2px solid #2a3290;padding-left:8px;margin-bottom:6px;display:block}
  .banner{align-self:center;background:rgba(54,224,122,.12);border:1px solid var(--win);color:var(--win);padding:10px 16px;border-radius:12px;font-weight:700}
  .compose{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #1c237a}
  .compose input{flex:1;background:var(--panel2);color:var(--ink);border:1px solid #2a3290;border-radius:10px;padding:11px 13px;font-size:14px}
  .compose button{background:var(--cyan);color:#021018;border:none;border-radius:10px;padding:0 18px;font-weight:700;cursor:pointer}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#1b227a;color:var(--cyan)}
  code{background:#0a0f3a;padding:1px 5px;border-radius:4px}
  .empty{color:var(--mut);margin:auto;text-align:center}
</style>
</head>
<body>
<header><h1>🏰 THE <span class="tag">GAUNTLET</span></h1><span class="pill" id="mode">loading…</span></header>
<div class="wrap">
  <aside>
    <h2>Challenges</h2>
    <div id="gallery"></div>
  </aside>
  <main>
    <div class="bar">
      <label>Level <select id="level"></select></label>
      <label>🧠 Thinking
        <select id="think"><option value="">default</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select>
      </label>
      <input id="sid" placeholder="session id (optional)" style="width:180px">
      <button id="start">New Session</button>
      <span class="pill" id="state"></span>
      <button class="ghost" id="export" style="display:none">Export finding.json</button>
    </div>
    <div class="brief" id="brief">Pick a challenge on the left, then <b>New Session</b>.</div>
    <div id="log"><div class="empty">No session yet.</div></div>
    <div class="compose">
      <input id="prompt" placeholder="type your attack prompt…" autocomplete="off" disabled>
      <button id="send" disabled>Send</button>
    </div>
  </main>
</div>
<script>
const api = (p,o)=>fetch(p,o).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e)));
let picked=null, session=null;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(role, content){
  const log=document.getElementById('log');
  const d=document.createElement('div');
  if(role==='sys'){d.className='msg sys';d.textContent=content;}
  else if(role==='banner'){d.className='banner';d.textContent=content;}
  else{
    d.className='msg '+(role==='user'?'me':'bot');
    let html=esc(content).replace(/&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g,'<span class="think">🧠 $1</span>');
    d.innerHTML=html;
  }
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

async function loadGallery(){
  const chs=await api('/challenges');
  const g=document.getElementById('gallery'); g.innerHTML='';
  chs.forEach(c=>{
    const el=document.createElement('div');
    el.className='ch'+(c.agentic?' dis':'');
    el.innerHTML=`<div class="t">${c.badge} ${c.id}</div><div class="m">${c.topic}${c.agentic?' · agentic (Phase 2)':''}</div>`;
    if(!c.agentic){ el.onclick=()=>{picked=c; document.getElementById('level').value=c.default_level;
      document.getElementById('brief').innerHTML=`<b>${c.badge} ${c.id}</b> — ${c.brief}`;}; }
    g.appendChild(el);
  });
}

document.getElementById('start').onclick=async()=>{
  if(!picked){alert('Pick a challenge first');return;}
  const body={challenge:picked.id, level:document.getElementById('level').value};
  const think=document.getElementById('think').value; if(think) body.overrides={reasoning_effort:think};
  const sid=document.getElementById('sid').value.trim(); if(sid) body.session_id=sid;
  try{
    session=await api('/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }catch(e){alert('Error: '+(e.detail||JSON.stringify(e)));return;}
  document.getElementById('log').innerHTML='';
  render('sys',`Session ${session.session_id} · ${session.badge} ${session.challenge} · ${session.level} (${session.level_label||''}) · 🧠 ${session.reasoning_effort||'default'} · ${session.model.replace('groq/','')}`);
  render('sys', (session.guards&&session.guards.length)?('🛡️ Guards: '+session.guards.join(', ')):'🛡️ Guards: none');
  render('sys','Goal: '+session.brief);
  document.getElementById('state').textContent='● live';
  document.getElementById('export').style.display='none';
  document.getElementById('prompt').disabled=false; document.getElementById('send').disabled=false;
  document.getElementById('prompt').focus();
};

async function send(){
  const inp=document.getElementById('prompt'); const text=inp.value.trim();
  if(!text||!session) return; inp.value='';
  render('user',text);
  let r; try{ r=await api(`/sessions/${session.session_id}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}); }
  catch(e){render('sys','Error: '+(e.detail||JSON.stringify(e)));return;}
  render(r.blocked?'sys':'bot', r.reply);
  if(r.won && !r.already_solved){
    const s=r.score;
    render('banner',`✅ SOLVED in ${r.attempts} attempt(s) · total ${r.total}  |  Sev ${s.severity} · Br ${s.breadth} · Nov ${s.novelty} · Rep ${s.reproducibility} · Ins ${s.insight}`);
    document.getElementById('state').textContent='✅ solved';
    document.getElementById('export').style.display='inline-block';
  }
}
document.getElementById('send').onclick=send;
document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')send();});

document.getElementById('export').onclick=async()=>{
  const t=await api(`/sessions/${session.session_id}/transcript`);
  const blob=new Blob([JSON.stringify(t.finding,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`finding_${session.challenge}_${session.level}.json`; a.click();
};

async function loadLevels(){
  const d=await api('/levels');
  const sel=document.getElementById('level'); sel.innerHTML='';
  d.ladder.forEach(l=>{ const o=document.createElement('option'); o.value=l.level;
    const g=l.guards.length?(' · '+l.guards.join('+')):' · no guards';
    o.textContent=`${l.level} · ${l.label}${g}`; sel.appendChild(o); });
  try{document.getElementById('mode').textContent='model: '+d.model.replace('groq/','');}catch(e){}
}
(async()=>{ await loadGallery(); await loadLevels(); })();
</script>
</body>
</html>
