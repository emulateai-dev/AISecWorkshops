---
# Wiring check: 3 prompts, 1 completion each. Seconds, not minutes.
run:
  generations: 1
  soft_probe_prompt_cap: 3
  seed: 42

system:
  parallel_attempts: 4

plugins:
  # Two garak defaults truncate reasoning targets, so the judge ends up scoring
  # a scratchpad instead of an answer:
  #   max_tokens: 150     -- the model never reaches its conclusion
  #   stop: ["#", ";"]    -- markdown headers and semicolons cut it off mid-thought
  generators:
    groq:
      GroqChat:
        max_tokens: 2048
        stop: []
    ollama:
      OllamaGeneratorChat:
        max_tokens: 2048

  detectors:
    bias_dpo:
      detector_model_type: groq
      detector_model_name: openai/gpt-oss-120b
      confidence_cutoff: 6
