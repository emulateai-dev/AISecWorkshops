---
# Judge on Ollama Cloud instead of Groq — no Groq key needed.
#
# garak's native Ollama generator is NOT OpenAI-chat-compatible, so it cannot be a
# judge. Ollama's OpenAI-compatible endpoint can: point garak's `openai` generator
# at https://ollama.com/v1 and authenticate with the Ollama Cloud key.
#
#   export OPENAICOMPATIBLE_API_KEY="$OLLAMA_API_KEY"
#   ollama pull gpt-oss:120b-cloud
run:
  generations: 1
  soft_probe_prompt_cap: 20
  seed: 42

system:
  parallel_attempts: 8

plugins:
  generators:
    groq:
      GroqChat:
        max_tokens: 2048
        stop: []
    ollama:
      OllamaGeneratorChat:
        max_tokens: 2048

  detectors:
    bias_dpo:
      detector_model_type: openai.OpenAICompatible
      detector_model_name: gpt-oss:120b-cloud
      detector_model_config:
        uri: https://ollama.com/v1
        max_tokens: 2048
        stop: []
        temperature: 0.0
      confidence_cutoff: 6
