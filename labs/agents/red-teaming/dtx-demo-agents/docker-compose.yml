version: '3.4'

# DTX Demo Agents — a small sandbox of target GenAI apps (chat, RAG, tool-use,
# text2sql) sitting behind a jailbreak/prompt-guard proxy. Originally lived in
# the (now-retired-as-a-dependency) detoxio-ai/ai-red-teaming-training repo at
# lab/vuln_apps/dtx_vuln_app_lab — vendored here so AISecWorkshops doesn't need
# to clone that entire separate repo just for this one compose stack.
#
# IMPORTANT: the `ollama` service below uses a named Docker volume
# (dtx_demo_ollama_data), NOT a bind-mount of $HOME/.ollama. Do not change
# this back to a $HOME/.ollama bind mount — this stack's Ollama container
# would then share the exact same model storage as the host's own Ollama
# service (installed by labs/setup/vm/Pre_Installation.sh), and two
# independent Ollama daemons writing to the same blob store concurrently is
# a real corruption/lock-contention risk, not just a naming clash.
services:
  pg:
    image: detoxio/dtxguard:0.2.1
    ports:
      - "${PG_PORT}:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      CACHE_TTL: ${CACHE_TTL}
      CACHE_DIR: ${CACHE_DIR}

  demo:
    image: detoxio/dtxguard-demo:0.3.0
    ports:
      - "${DEMO_PORT}:7860"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DTXPROMPT_GUARD_SVC_URL: ${DTXPROMPT_GUARD_SVC_URL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      ENABLE_JAILBREAK_SECURITY: ${ENABLE_JAILBREAK_SECURITY:-False}
      CONCURRENCY_LIMIT: ${CONCURRENCY_LIMIT:-1}

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434" # Host:Container
    volumes:
      - dtx_demo_ollama_data:/root/.ollama
    command: [ "serve" ]
    environment:
      OLLAMA_FORCE_CPU: "true"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4g"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${OLLAMA_PORT}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama-model-downloader:
    image: ollama/ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      'for model in $(echo "$$DOWNLOAD_OLLAMA_MODELS" | tr "," "\n"); do
        echo "Pulling $$model...";
        ollama pull $$model;
      done'
    environment:
      DOWNLOAD_OLLAMA_MODELS: ${DOWNLOAD_OLLAMA_MODELS}
      OLLAMA_HOST: ollama:11434
    depends_on:
      - ollama

  demo_rag:
    image: detoxio/dtxguard-demo-rag:3.1.0
    ports:
      - "${DEMO_RAG_PORT}:7860"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DTXPROMPT_GUARD_SVC_URL=${DTXPROMPT_GUARD_SVC_URL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - CONCURRENCY_LIMIT=${CONCURRENCY_LIMIT:-1}

  demo_tool_agents:
    image: detoxio/dtxguard-demo-tool-agents:1.0.0
    ports:
      - "${DEMO_TOOL_AGENTS_PORT}:7860"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DTXPROMPT_GUARD_SVC_URL=${DTXPROMPT_GUARD_SVC_URL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - CONCURRENCY_LIMIT=${CONCURRENCY_LIMIT:-1}

  demo_text2sql_agents:
    image: detoxio/dtxguard-demo-text2sql:2.0.0
    ports:
      - "${DEMO_TEXT2SQL_AGENTS_PORT}:7860"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DTXPROMPT_GUARD_SVC_URL=${DTXPROMPT_GUARD_SVC_URL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - CONCURRENCY_LIMIT=${CONCURRENCY_LIMIT:-1}

volumes:
  dtx_demo_ollama_data:
